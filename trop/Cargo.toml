[package]
name = "trop"
version = "0.2.0"
edition = "2021"
authors = ["trop contributors"]
license = "Apache-2.0 OR MIT"
description = "Library for managing ephemeral port reservations"
repository = "https://github.com/plx/trop"

[features]
default = []
property-tests = []

[dependencies]
clap = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
home = { workspace = true }
socket2 = "0.6"
netstat2 = "0.11"
sysinfo = { version = "0.33", default-features = false, features = ["system", "user"] }
gix = { version = "0.68", default-features = false, features = ["revision"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinSock"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1.0"
criterion = "0.5"
serial_test = "3.2"
mockall = "0.13"
assert_cmd = "2.0"

[[bench]]
name = "path_bench"
harness = false

[[bench]]
name = "operations_bench"
harness = false
