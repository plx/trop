name: Plugin validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Marketplaces and plugins
    runs-on: ubuntu-latest
    env:
      # Includes validation of standalone skill directories.
      CLAUDE_CODE_VERSION: 2.1.252
      CODEX_VERSION: 0.144.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install plugin harnesses
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"

      - name: Validate marketplaces, plugins, and synchronized skills
        run: just validate-plugins
