<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; }
  .chip { height: 68px; border-radius: var(--tool-radius); border: 1px solid var(--tool-line); }
  .name { margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--tool-ink); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--tool-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tool-accent)"></div><div class="name">Accent</div><div class="hex">#3a6b5f</div></div>
    <div class="sw"><div class="chip" style="background:var(--tool-accent-2)"></div><div class="name">Accent 2</div><div class="hex">#8ba8b9</div></div>
    <div class="sw"><div class="chip" style="background:var(--tool-navy)"></div><div class="name">Navy</div><div class="hex">#1e2a3a</div></div>
    <div class="sw"><div class="chip" style="background:var(--tool-ink)"></div><div class="name">Ink</div><div class="hex">#0b1220</div></div>
  </div>
</body>
</html>
