<!-- @dsCard group="Type" viewport="700x170" name="Mono — JetBrains Mono" subtitle="Commands, code, port numbers & metadata" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--tool-ink); }
  .wrap { padding: 22px 24px; }
  .code { background: var(--tool-code); color: var(--tool-code-ink); border-radius: var(--tool-radius); padding: 16px 18px; font-family: var(--font-mono); font-size: 14px; line-height: 1.75; }
  .code .c { color: #8ba8b9; }
  .meta { margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--tool-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code"><span class="c"># reserve, then run</span><br>PORT=$(trop reserve)<br>npm run dev -- --port "$PORT"</div>
    <div class="meta">JetBrains Mono · 400/500/700 · line-height 1.75</div>
  </div>
</body>
</html>
