<!-- @dsCard group="Type" viewport="700x200" name="Body — Source Sans 3" subtitle="UI & prose. Regular to heavy for labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--tool-ink); }
  .wrap { padding: 22px 24px; }
  .lede { font-size: 20px; font-weight: 700; line-height: 1.2; margin: 0 0 8px; }
  .body { font-size: 16px; color: var(--tool-muted); margin: 0; max-width: 60ch; line-height: 1.5; }
  .weights { display: flex; gap: 20px; margin-top: 14px; }
  .weights span { font-size: 15px; }
  .meta { margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--tool-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="lede">Stable, directory-aware port reservations.</p>
    <p class="body">Replace hardcoded port numbers in your dev scripts with reservations that stay put across restarts and clean themselves up when a worktree is removed.</p>
    <div class="weights">
      <span style="font-weight:400">Regular 400</span>
      <span style="font-weight:600">Semibold 600</span>
      <span style="font-weight:800">Heavy 800</span>
    </div>
    <div class="meta">Source Sans 3 · body & interface text</div>
  </div>
</body>
</html>
