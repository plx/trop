<!-- @dsCard group="Brand" viewport="700x180" name="Voice" subtitle="Plain, precise, lowercase command voice — no hype" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--tool-ink); }
  .wrap { padding: 22px 24px; }
  .eyebrow { color: var(--tool-accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 10px; }
  .say { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0; max-width: 32ch; }
  .say b { color: var(--tool-accent); }
  .foot { display: flex; gap: 22px; margin-top: 16px; font-size: 13px; color: var(--tool-muted); }
  .foot b { color: var(--tool-ink); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Reserve · Don't guess</p>
    <p class="say">One narrow problem, solved well: <b>stable localhost ports</b> for one user across local worktrees.</p>
    <div class="foot"><span><b>lowercase</b> product name</span><span><b>you</b>, not the user</span><span>no emoji</span><span>no exclamation hype</span></div>
  </div>
</body>
</html>
