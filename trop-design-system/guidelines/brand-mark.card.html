<!-- @dsCard group="Brand" viewport="700x180" name="The mark" subtitle="Line-drawn warehouse on the quay — light & dark lockups" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--tool-ink); }
  .wrap { padding: 22px 24px; display: flex; align-items: center; gap: 32px; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup img { width: 56px; height: 56px; }
  .word { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.01em; }
  .dark { background: var(--tool-navy); border-radius: var(--tool-radius); padding: 14px 20px; }
  .dark .word { color: #f4f6f8; }
  .meta { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--tool-muted); max-width: 22ch; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lockup"><img src="../assets/tool-mark.svg" alt="trop mark"><span class="word">trop</span></div>
    <div class="lockup dark"><img src="../assets/favicon.svg" alt="trop mark"><span class="word">trop</span></div>
    <div class="meta">Wordmark is always lowercase. Mark reads as a small dockside warehouse.</div>
  </div>
</body>
</html>
